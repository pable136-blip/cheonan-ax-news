name: AI 동향보고서

# 천안시 관점 AX 동향보고서를 만든다 — 진행 중인 분기, 아직 확정 안 된 분기, 그리고
# 전체 보고서. 끝난 분기는 한 번 확정되면 다시 만들지 않는다.
#
# 지금은 수동 실행만 둔다. 저장소에 쓸 수 있는 Anthropic API 키가 없어서 예약 실행을
# 두면 매달 실패 알림만 온다. 키를 ANTHROPIC_API_KEY 시크릿으로 등록한 뒤 매월 자동으로
# 돌리려면 아래 주석을 풀면 된다(매월 1일 12:00 KST — 수집 워크플로가 끝난 뒤).
#
# ANTHROPIC_API_KEY 시크릿이 없으면 실패로 끝난다. 수집과 달리 보고서는 AI 없이는 만들 수
# 없어서, 조용히 건너뛰면 보고서가 왜 안 바뀌는지 알아챌 길이 없다.
on:
  # schedule:
  #   - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      quarter:
        description: "이 분기 하나만 생성(예: 2026-Q3). 비우면 필요한 것 전부"
        type: string
        default: ""
      force:
        description: "확정된 분기까지 전부 다시 생성(약 $10)"
        type: boolean
        default: false

permissions:
  contents: write

# 수집 워크플로와 같은 그룹 — 둘 다 main 에 커밋하므로 동시에 돌면 push 가 충돌한다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    # 스크립트 예산(100분)보다 위 — 첫 실행은 분기 5건 + 전체를 한 번에 만든다.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fallbacks="default" 파라미터를 받는 버전부터.
      - name: 의존성 설치
        run: pip install "anthropic>=1.6"

      # 입력값은 run 에 직접 넣지 않고 환경변수로 넘긴다(스크립트 주입 방지).
      - name: 보고서 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUARTER: ${{ inputs.quarter }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$QUARTER" ]; then args+=(--quarter "$QUARTER"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/build_reports.py "${args[@]}"

      # 일부 보고서가 실패해도 만들어진 건 커밋한다(잡은 실패로 남아 알림이 간다).
      - name: 변경사항 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git add data
          git commit -m "AI 동향보고서 생성 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"
          git push
