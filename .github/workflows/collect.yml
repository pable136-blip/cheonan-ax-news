name: 천안시 보도자료 수집

# 매일 07:20 KST(22:20 UTC 전날)에 천안시 누리집 보도자료를 훑어
# AI/AX 관련 기사를 data/ 에 누적하고, 바뀐 게 있으면 커밋한다.
on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:
    inputs:
      no_summary:
        description: "AI 요약 건너뛰기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ANTHROPIC_API_KEY 시크릿이 등록돼 있을 때만 AI 요약을 돌린다.
      # 없으면 수집만 하고 요약은 조용히 건너뛴다(사이트는 정상 동작).
      - name: 의존성 설치
        run: pip install anthropic

      - name: 수집 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.no_summary }}" = "true" ]; then
            python scripts/collect_cheonan.py --no-summary
          else
            python scripts/collect_cheonan.py
          fi

      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git add data
          git commit -m "천안시 보도자료 자동 수집 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"
          git push
