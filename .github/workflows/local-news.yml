name: 천안 언론 뉴스 수집
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 천안 뉴스 수집
        run: python scripts/collect_local_news.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/local-news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '천안 언론 뉴스 갱신'
          git pull --rebase origin main
          git push
