<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>참여기업 관리대장</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--surface-2:#eef1f6;--border:#e0e0e0;--text:#1d1d1f;--text-dim:#6b6b6b;
  --primary:#2257b4;--primary-dim:#1c4690;--brand-soft:#e9f0fa;--accent:#d64210;--accent-soft:#fbeee8;
  --green:#00843a;--green-soft:#e6f5ec;--warn:#9a6700;--warn-soft:#fff4d6;
  --radius:14px;--shadow:0 1px 2px rgba(20,28,46,.04),0 6px 20px rgba(20,28,46,.05);color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:15px;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top-inner{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:800;color:var(--primary-dim)}
.top h1 small{font-weight:500;color:var(--text-dim);font-size:13px;margin-left:8px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--text-dim);font-weight:600}
nav.tabs button.on{background:var(--brand-soft);color:var(--primary)}
nav.tabs button:hover{color:var(--primary)}
.privacy{background:var(--brand-soft);color:var(--primary-dim);font-size:13px;padding:6px 0}
.privacy .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.privacy b{font-weight:700}
main{padding:22px 0 60px}
h2{font-size:20px;margin:0 0 14px}
h3{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi .l{font-size:13px;color:var(--text-dim)}
.kpi .v{font-size:24px;font-weight:800;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--text-dim);margin-left:3px}
.kpi .s{font-size:12px;color:var(--text-dim)}
.btn{border:1px solid var(--border);background:var(--surface);padding:7px 13px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-dim);color:#fff}
.btn.danger{color:var(--accent)}
.btn.danger:hover{border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.link{border:0;background:none;padding:0;color:var(--primary);font-weight:600}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12.5px;color:var(--text-dim);font-weight:700;background:var(--surface-2);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#f8faff}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:600;margin:1px 3px 1px 0;white-space:nowrap}
.chip.blue{background:var(--brand-soft);color:var(--primary)}
.chip.org{background:var(--accent-soft);color:var(--accent)}
.chip.grn{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.lv{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.lv.pub{background:var(--green-soft);color:var(--green)}
.lv.int{background:var(--brand-soft);color:var(--primary)}
.lv.sec{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--text-dim)}
.small{font-size:13px}
.empty{padding:28px;text-align:center;color:var(--text-dim)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=password],input[type=search],input[type=url],select,textarea{border:1px solid var(--border);border-radius:9px;padding:7px 10px;background:#fff;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--primary)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters>*{width:auto}
.filters input[type=search]{width:220px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 22px}
.info-grid .k{font-size:12.5px;color:var(--text-dim)}
.info-grid .v{white-space:pre-wrap;word-break:break-word}
.mask{letter-spacing:2px;color:var(--text-dim)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{border-left:3px solid var(--brand-soft);padding:2px 0 14px 14px;position:relative}
.timeline li:before{content:"";position:absolute;left:-7px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--primary)}
.timeline .d{font-size:13px;color:var(--text-dim)}
.timeline .t{font-weight:700}
.timeline .c{white-space:pre-wrap;font-size:14px;margin-top:2px}
.fu{font-size:13.5px;margin-top:4px}
.fu label{cursor:pointer}
.fu .done{text-decoration:line-through;color:var(--text-dim)}
.back{margin-bottom:10px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,28,46,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal{background:var(--surface);border-radius:16px;max-width:760px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:18px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px}
.f.wide{grid-column:1/-1}
.f>label{font-size:13px;font-weight:700;color:#444}
.f .hint{font-size:12px;color:var(--text-dim)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 0}
.checks label{display:flex;gap:5px;align-items:center;font-size:14px;cursor:pointer}
.fu-row{display:grid;grid-template-columns:auto 1fr 150px auto;gap:6px;align-items:center;margin-bottom:6px}
.modal .actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 18px;border-radius:10px;z-index:80;font-size:14px;max-width:90vw}
/* lock */
.lock{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.lock .box{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:460px;width:100%;padding:28px;box-shadow:var(--shadow)}
.lock h2{color:var(--primary-dim)}
.lock .f{margin-bottom:12px}
.notice{background:var(--warn-soft);color:#5c4300;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.notice.blue{background:var(--brand-soft);color:var(--primary-dim)}
.err{color:var(--accent);font-size:13.5px;min-height:20px}
@media (max-width:640px){.wrap{padding:0 16px}.fu-row{grid-template-columns:auto 1fr}.fu-row input[type=date]{grid-column:2}.filters input[type=search]{width:100%}nav.tabs{margin-left:0}}
@media print{header.top,.privacy,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap top-inner">
  <h1>참여기업 관리대장<small>해외 AI·스마트시티 박람회 참여기업</small></h1>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<div class="privacy no-print"><div class="wrap">
  <span>🔒 <b>이 PC의 브라우저에만 저장</b>되고 인터넷으로 전송되지 않습니다. 정기적으로 <b>백업 파일</b>을 내부 공유폴더에 보관하세요.</span>
  <span class="spacer"></span><span id="saveState" class="small"></span>
  <button class="btn sm" data-act="lock" id="lockBtn" hidden>잠금</button>
</div></div>
<main><div class="wrap" id="app"></div></main>
<div id="lockRoot"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ===================== 기본 정의 ===================== */
const STORE_ENC = "cxp.enc.v1", STORE_PLAIN = "cxp.plain.v1", STORE_UI = "cxp.ui.v1";
const LV = {pub:"공개", int:"내부", sec:"대외비"};
const LV_HINT = {pub:"홍보자료에 써도 되는 정보", int:"시 내부 업무용", sec:"화면에서 가려 두고, 외부로 내보낼 때 기본 제외"};
const STATUS = ["참여중","휴면","종료"];
const ACT_TYPES = ["면담","현장방문","기업행사","기부·사회공헌","네트워킹","박람회 현장","수상·인증","기타"];
const SOURCES = ["기업 제출","담당자 확인","면담 청취"];

const COMPANY_FIELDS = [
  {k:"name",label:"기업명",lv:"pub",req:true},
  {k:"field",label:"분야",lv:"pub",hint:"예: AI 영상분석, 스마트 모빌리티"},
  {k:"status",label:"참여 상태",type:"select",options:STATUS,lv:"int"},
  {k:"joinedYear",label:"참여 시작 연도",type:"number",lv:"int"},
  {k:"products",label:"주요 제품·서비스",type:"textarea",lv:"pub",wide:true},
  {k:"website",label:"홈페이지",type:"url",lv:"pub"},
  {k:"ceo",label:"대표자",lv:"int"},
  {k:"address",label:"소재지",lv:"int"},
  {k:"employeesBase",label:"참여 당시 직원 수(명)",type:"number",lv:"int",hint:"고용 증가를 비교하는 기준값"},
  {k:"bizNo",label:"사업자등록번호",lv:"sec"},
  {k:"contactName",label:"실무 담당자",lv:"sec"},
  {k:"contactPhone",label:"담당자 연락처",type:"tel",lv:"sec"},
  {k:"contactEmail",label:"담당자 이메일",type:"email",lv:"sec"},
  {k:"consentPublic",label:"실적 공개 동의",type:"check",lv:"int",hint:"동의한 기업만 공개용 요약에 기업명과 개별 실적이 나옵니다"},
  {k:"memo",label:"내부 메모",type:"textarea",lv:"sec",wide:true}
];
const REPORT_FIELDS = [
  {k:"companyId",label:"기업",type:"company",req:true},
  {k:"period",label:"기준 분기",type:"period",req:true},
  {k:"source",label:"자료 출처",type:"select",options:SOURCES},
  {k:"contracts",label:"계약 건수",type:"number",lv:"int",unit:"건"},
  {k:"contractAmount",label:"계약 금액(백만원)",type:"number",lv:"int",unit:"백만원"},
  {k:"overseasContracts",label:"그중 해외 계약 건수",type:"number",lv:"int",unit:"건"},
  {k:"overseasCountries",label:"해외 계약·협의 국가",lv:"int",hint:"예: 스페인, 베트남"},
  {k:"mous",label:"MOU·협약 건수",type:"number",lv:"int",unit:"건"},
  {k:"newHires",label:"신규 고용(명)",type:"number",lv:"int",unit:"명"},
  {k:"totalEmployees",label:"분기말 총 직원 수(명)",type:"number",lv:"int",unit:"명"},
  {k:"investment",label:"투자 유치(백만원)",type:"number",lv:"sec",unit:"백만원"},
  {k:"revenue",label:"분기 매출(백만원)",type:"number",lv:"sec",unit:"백만원"},
  {k:"certifications",label:"특허·인증·수상",type:"textarea",lv:"pub"},
  {k:"expoRelated",label:"박람회 연계 성과",type:"textarea",lv:"int",hint:"박람회에서 만난 바이어와의 후속 진행 등",wide:true},
  {k:"suggestions",label:"기업 건의사항",type:"textarea",lv:"int",wide:true},
  {k:"memo",label:"담당자 메모",type:"textarea",lv:"sec",wide:true}
];
const EXPO_FIELDS = [
  {k:"name",label:"박람회명",req:true,hint:"예: SCEWC 2025 (Smart City Expo World Congress)"},
  {k:"city",label:"개최지",hint:"예: 스페인 바르셀로나"},
  {k:"start",label:"시작일",type:"date",req:true},
  {k:"end",label:"종료일",type:"date"},
  {k:"booth",label:"참가 형태",hint:"예: 천안시 공동관 8개사"},
  {k:"budget",label:"지원 예산(백만원)",type:"number",lv:"int"},
  {k:"companyIds",label:"참가 기업",type:"companies",wide:true},
  {k:"meetings",label:"현장 상담 건수",type:"number"},
  {k:"mous",label:"현장 MOU 건수",type:"number"},
  {k:"onsiteContracts",label:"현장 계약 건수",type:"number"},
  {k:"pipelineAmount",label:"상담·계약 추진액(백만원)",type:"number",lv:"int"},
  {k:"memo",label:"결과 메모",type:"textarea",wide:true}
];
const ACT_FIELDS = [
  {k:"type",label:"구분",type:"select",options:ACT_TYPES,req:true},
  {k:"date",label:"날짜",type:"date",req:true},
  {k:"title",label:"제목",req:true,wide:true,hint:"예: ○○기업 대표 면담 — 해외 실증 협의"},
  {k:"companyIds",label:"관련 기업",type:"companies",wide:true},
  {k:"place",label:"장소"},
  {k:"attendees",label:"참석자",hint:"시: 과장, 주무관 / 기업: 대표 등"},
  {k:"amount",label:"금액(만원)",type:"number",hint:"기부·후원 금액 등 해당 시"},
  {k:"level",label:"기록 공개 범위",type:"select",options:[["int","내부"],["sec","대외비"],["pub","공개"]]},
  {k:"content",label:"내용",type:"textarea",wide:true,hint:"주요 논의, 기업 요청사항, 시 답변"},
  {k:"followups",label:"후속조치",type:"followups",wide:true}
];

/* ===================== 상태 ===================== */
let DB = null;             // 실제 데이터
let KEY = null, SALT = null; // 암호화 키
let UI = loadUI();
let saveTimer = null, idleTimer = null;
const reveal = new Set();  // 가림 해제한 기업 id

function emptyDB(){
  return {format:"cxp-db",v:1,createdAt:new Date().toISOString(),
    settings:{dept:"천안시",formUrl:"",lastBackup:null},
    companies:[],expos:[{id:uid(),name:"SCEWC 2025 (Smart City Expo World Congress)",city:"스페인 바르셀로나",start:"2025-11-04",end:"2025-11-06",booth:"천안시 참가 기업",companyIds:[],memo:"날짜·참가 형태를 실제와 맞게 고쳐 주세요."}],
    reports:[],activities:[]};
}
function loadUI(){try{return JSON.parse(localStorage.getItem(STORE_UI))||{tab:"dash"}}catch(e){return {tab:"dash"}}}
function saveUI(){try{localStorage.setItem(STORE_UI,JSON.stringify(UI))}catch(e){}}

/* ===================== 유틸 ===================== */
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,16)}
function h(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function fmt(n){return num(n).toLocaleString("ko-KR")}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function quarterOf(d=new Date()){return d.getFullYear()+"-Q"+(Math.floor(d.getMonth()/3)+1)}
function prevQuarter(p){let [y,q]=p.split("-Q").map(Number);q--;if(q<1){q=4;y--}return y+"-Q"+q}
function periodLabel(p){if(!p)return"";const [y,q]=p.split("-Q");return y+"년 "+q+"분기"}
function periods(){const out=[];let p=quarterOf();const stop="2024-Q4";while(p!==stop&&out.length<40){out.push(p);p=prevQuarter(p)}return out}
function byId(list,id){return list.find(x=>x.id===id)}
function cname(id){const c=byId(DB.companies,id);return c?c.name:"(삭제된 기업)"}
function sortCompanies(){return [...DB.companies].sort((a,b)=>a.name.localeCompare(b.name,"ko"))}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function download(name,text,type="application/json"){const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function normName(s){return String(s||"").replace(/\(주\)|㈜|주식회사|\s/g,"").toLowerCase()}
function lvBadge(lv){return lv?`<span class="lv ${lv}" title="${h(LV_HINT[lv])}">${LV[lv]}</span>`:""}

/* ===================== 암호화 ===================== */
const te=new TextEncoder(), td=new TextDecoder();
function b64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function cryptoOK(){return !!(window.crypto&&crypto.subtle)}
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encryptObj(obj,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,te.encode(JSON.stringify(obj)));return {alg:"PBKDF2-SHA256-250k/AES-GCM",salt:b64(salt),iv:b64(iv),ct:b64(ct)}}
async function decryptObj(env,pw){const salt=unb64(env.salt);const key=await deriveKey(pw,salt);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(env.iv)},key,unb64(env.ct));return {obj:JSON.parse(td.decode(pt)),key,salt}}

/* ===================== 저장 ===================== */
function markDirty(){setSave("저장 중…");clearTimeout(saveTimer);saveTimer=setTimeout(persist,300)}
async function persist(){
  try{
    if(KEY){const env=await encryptObj(DB,KEY,SALT);localStorage.setItem(STORE_ENC,JSON.stringify(env));localStorage.removeItem(STORE_PLAIN)}
    else{localStorage.setItem(STORE_PLAIN,JSON.stringify(DB));localStorage.removeItem(STORE_ENC)}
    setSave(KEY?"🔐 암호화 저장됨":"저장됨(암호 미설정)");
  }catch(e){setSave("⚠ 브라우저 저장 실패 — 백업 파일로 저장하세요");console.error(e)}
}
function setSave(t){const el=document.getElementById("saveState");if(el)el.textContent=t}
function commit(){DB.updatedAt=new Date().toISOString();markDirty();render()}

/* ===================== 잠금·초기 설정 ===================== */
function boot(){
  let enc=null,plain=null;
  try{enc=localStorage.getItem(STORE_ENC);plain=localStorage.getItem(STORE_PLAIN)}catch(e){}
  if(enc){showUnlock(JSON.parse(enc))}
  else if(plain){DB=migrate(JSON.parse(plain));start()}
  else showSetup();
}
function lockShell(inner){document.getElementById("lockRoot").innerHTML=`<div class="lock"><div class="box">${inner}</div></div>`}
function showUnlock(env){
  lockShell(`<h2>🔒 잠겨 있습니다</h2><p class="muted small">기업 정보를 보려면 관리대장 암호를 입력하세요.</p>
  <form id="unlockForm"><div class="f"><label>암호</label><input type="password" id="pw" autocomplete="current-password" autofocus></div>
  <div class="err" id="err"></div><button class="btn pri" style="width:100%">열기</button></form>
  <p class="small muted" style="margin-top:16px">암호를 잊었다면 이 PC의 데이터는 열 수 없습니다. 백업 파일이 있으면 <button class="btn link" data-act="resetAll">초기화 후 백업 복원</button>할 수 있습니다.</p>`);
  document.getElementById("unlockForm").onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("pw").value;
    document.getElementById("err").textContent="확인 중…";
    try{const r=await decryptObj(env,pw);DB=migrate(r.obj);KEY=r.key;SALT=unb64(env.salt);start()}
    catch(err){document.getElementById("err").textContent="암호가 맞지 않습니다."}};
}
function showSetup(){
  lockShell(`<h2>참여기업 관리대장 시작</h2>
  <p class="small">기업 연락처·계약 금액 같은 대외비 정보가 들어가므로 <b>암호를 설정</b>하는 것을 권장합니다. 데이터는 이 PC 브라우저에 암호화되어 저장됩니다.</p>
  ${cryptoOK()?"":`<div class="notice">이 브라우저에서는 암호화 기능을 쓸 수 없습니다. 크롬·엣지 최신 버전에서 열어 주세요.</div>`}
  <form id="setupForm"><div class="f"><label>새 암호 (8자 이상)</label><input type="password" id="pw1" autocomplete="new-password"></div>
  <div class="f"><label>암호 확인</label><input type="password" id="pw2" autocomplete="new-password"></div>
  <div class="notice">암호는 어디에도 따로 저장되지 않습니다. 잊으면 복구할 수 없으니 부서 내 보안 지침에 따라 관리하세요.</div>
  <div class="err" id="err"></div>
  <button class="btn pri" style="width:100%" ${cryptoOK()?"":"disabled"}>암호 설정하고 시작</button></form>
  <div class="row" style="margin-top:14px"><button class="btn" data-act="restoreFromSetup">백업 파일로 복원</button><span class="spacer"></span><button class="btn link" data-act="noPassword">암호 없이 시작</button></div>`);
  document.getElementById("setupForm").onsubmit=async e=>{e.preventDefault();const a=pw1.value,b=pw2.value,err=document.getElementById("err");
    if(a.length<8){err.textContent="8자 이상으로 정해 주세요.";return}if(a!==b){err.textContent="두 암호가 다릅니다.";return}
    SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(a,SALT);DB=DB||emptyDB();await persist();start()};
}
function migrate(d){d.settings=d.settings||{};d.companies=d.companies||[];d.expos=d.expos||[];d.reports=d.reports||[];d.activities=d.activities||[];return d}
function start(){document.getElementById("lockRoot").innerHTML="";document.getElementById("lockBtn").hidden=!KEY;setSave(KEY?"🔐 암호화 저장됨":"저장됨(암호 미설정)");render();armIdle()}
function armIdle(){if(!KEY)return;const reset=()=>{clearTimeout(idleTimer);idleTimer=setTimeout(lockNow,30*60*1000)};["click","keydown","mousemove"].forEach(ev=>document.addEventListener(ev,reset,{passive:true}));reset()}
async function lockNow(){if(!KEY)return;clearTimeout(saveTimer);await persist();DB=null;KEY=null;SALT=null;reveal.clear();document.getElementById("app").innerHTML="";closeModal();boot()}

/* ===================== 집계 ===================== */
function sumReports(list){const s={contracts:0,contractAmount:0,overseasContracts:0,mous:0,newHires:0,investment:0,revenue:0};list.forEach(r=>{for(const k in s)s[k]+=num(r[k])});return s}
function companyStats(cid){
  const reps=DB.reports.filter(r=>r.companyId===cid).sort((a,b)=>b.period.localeCompare(a.period));
  const acts=DB.activities.filter(a=>(a.companyIds||[]).includes(cid)).sort((a,b)=>b.date.localeCompare(a.date));
  const latestEmp=reps.find(r=>r.totalEmployees!==undefined&&r.totalEmployees!=="");
  return {reps,acts,sum:sumReports(reps),lastPeriod:reps[0]?.period||"",lastContact:acts[0]?.date||"",employees:latestEmp?num(latestEmp.totalEmployees):null,
    expos:DB.expos.filter(e=>(e.companyIds||[]).includes(cid))}
}
function openFollowups(){const out=[];DB.activities.forEach(a=>(a.followups||[]).forEach(f=>{if(!f.done)out.push({a,f})}));return out.sort((x,y)=>(x.f.due||"9999").localeCompare(y.f.due||"9999"))}

/* ===================== 화면 ===================== */
const TABS=[["dash","현황"],["companies","기업"],["reports","실적"],["activities","활동기록"],["expos","박람회"],["data","자료관리"]];
function render(){
  if(!DB)return;
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button class="${UI.tab===k?"on":""}" data-act="tab" data-k="${k}">${l}</button>`).join("");
  const v={dash:viewDash,companies:viewCompanies,reports:viewReports,activities:viewActivities,expos:viewExpos,data:viewData}[UI.tab]||viewDash;
  document.getElementById("app").innerHTML=v();
}

function viewDash(){
  const P=UI.dashPeriod||prevQuarter(quarterOf());
  const active=DB.companies.filter(c=>c.status!=="종료");
  const all=sumReports(DB.reports), per=sumReports(DB.reports.filter(r=>r.period===P));
  const yr=new Date().getFullYear()+"";
  const actsYr=DB.activities.filter(a=>(a.date||"").startsWith(yr));
  const missing=active.filter(c=>!DB.reports.some(r=>r.companyId===c.id&&r.period===P));
  const fus=openFollowups();
  const recent=[...DB.activities].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  const byP={};DB.reports.forEach(r=>{(byP[r.period]=byP[r.period]||[]).push(r)});
  const pRows=Object.keys(byP).sort().reverse().slice(0,8);
  const backupOld=!DB.settings.lastBackup||(Date.now()-new Date(DB.settings.lastBackup))>7*864e5;
  return `
  ${DB.companies.length===0?`<div class="card"><h3>처음 사용하시나요?</h3><ol class="small" style="margin:0;padding-left:20px;line-height:1.9">
    <li><b>기업</b> 탭에서 참여기업 8곳을 등록합니다. 대외비 항목(연락처·사업자번호 등)은 화면에서 가려집니다.</li>
    <li><b>박람회</b> 탭에서 SCEWC 등 참가 이력을 기업과 연결합니다.</li>
    <li>분기마다 기업에 <b>제출양식 링크</b>를 보내고, 받은 파일을 <b>자료관리 → 기업 제출파일 가져오기</b>로 불러옵니다.</li>
    <li>면담·기업행사·기부·네트워킹은 <b>활동기록</b>에 바로 남깁니다.</li></ol></div>`:""}
  ${backupOld&&DB.companies.length?`<div class="notice no-print">마지막 백업이 ${DB.settings.lastBackup?new Date(DB.settings.lastBackup).toLocaleDateString("ko-KR"):"없습니다"}. <button class="btn link" data-act="backup">지금 백업 파일 저장</button></div>`:""}
  <div class="kpis">
    <div class="kpi"><div class="l">참여기업</div><div class="v">${active.length}<small>곳</small></div><div class="s">전체 등록 ${DB.companies.length}곳</div></div>
    <div class="kpi"><div class="l">누적 계약</div><div class="v">${fmt(all.contracts)}<small>건</small></div><div class="s">${fmt(all.contractAmount)}백만원 · 해외 ${fmt(all.overseasContracts)}건</div></div>
    <div class="kpi"><div class="l">누적 신규 고용</div><div class="v">${fmt(all.newHires)}<small>명</small></div><div class="s">기업 보고 기준</div></div>
    <div class="kpi"><div class="l">누적 MOU·협약</div><div class="v">${fmt(all.mous)}<small>건</small></div><div class="s">투자유치 ${fmt(all.investment)}백만원</div></div>
    <div class="kpi"><div class="l">${yr}년 활동기록</div><div class="v">${actsYr.length}<small>건</small></div><div class="s">면담 ${actsYr.filter(a=>a.type==="면담").length} · 네트워킹 ${actsYr.filter(a=>a.type==="네트워킹").length}</div></div>
  </div>
  <div class="grid g2">
    <div class="card">
      <div class="row" style="margin-bottom:8px"><h3 style="margin:0">분기 실적 제출 현황</h3><span class="spacer"></span>
        <select data-chg="dashPeriod" style="width:auto">${periods().map(p=>`<option value="${p}" ${p===P?"selected":""}>${periodLabel(p)}</option>`).join("")}</select></div>
      <p class="small muted" style="margin:0 0 8px">${periodLabel(P)} — 제출 ${active.length-missing.length}곳 / 미제출 ${missing.length}곳 · 계약 ${fmt(per.contracts)}건 ${fmt(per.contractAmount)}백만원 · 신규고용 ${fmt(per.newHires)}명</p>
      ${missing.length?`<table><tbody>${missing.map(c=>`<tr><td>${h(c.name)}</td><td class="num"><button class="btn sm" data-act="copyRequest" data-id="${c.id}" data-p="${P}">요청 문구 복사</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">${active.length?"모든 기업이 제출했습니다 ✔":"등록된 기업이 없습니다"}</div>`}
    </div>
    <div class="card">
      <h3>미완료 후속조치 <span class="chip ${fus.length?"org":""}">${fus.length}</span></h3>
      ${fus.length?`<table><tbody>${fus.slice(0,8).map(({a,f})=>`<tr><td><label class="fu"><input type="checkbox" data-act="toggleFu" data-a="${a.id}" data-f="${f.id}"> ${h(f.text)}</label><div class="small muted">${h(a.date)} ${h(a.title)}</div></td><td class="num small ${f.due&&f.due<today()?"":"muted"}" style="${f.due&&f.due<today()?"color:var(--accent);font-weight:700":""}">${f.due?h(f.due):"기한 없음"}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">남은 후속조치가 없습니다</div>`}
    </div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>분기별 실적 합계</h3>
      ${pRows.length?`<div class="tbl-wrap"><table><thead><tr><th>분기</th><th class="num">제출</th><th class="num">계약(건)</th><th class="num">금액(백만원)</th><th class="num">신규고용</th><th class="num">MOU</th></tr></thead><tbody>
      ${pRows.map(p=>{const s=sumReports(byP[p]);return `<tr><td>${periodLabel(p)}</td><td class="num">${byP[p].length}</td><td class="num">${fmt(s.contracts)}</td><td class="num">${fmt(s.contractAmount)}</td><td class="num">${fmt(s.newHires)}</td><td class="num">${fmt(s.mous)}</td></tr>`}).join("")}
      </tbody></table></div>`:`<div class="empty">아직 실적이 없습니다</div>`}
    </div>
    <div class="card"><div class="row"><h3 style="margin:0">최근 활동</h3><span class="spacer"></span><button class="btn sm" data-act="newActivity">+ 기록</button></div>
      ${recent.length?`<ul class="timeline" style="margin-top:12px">${recent.map(actItem).join("")}</ul>`:`<div class="empty">활동기록이 없습니다</div>`}
    </div>
  </div>`;
}

function actItem(a){
  const comps=(a.companyIds||[]).map(id=>`<span class="chip blue">${h(cname(id))}</span>`).join("");
  return `<li><div class="d">${h(a.date)} · <span class="chip ${a.type==="기부·사회공헌"?"grn":a.type==="면담"?"blue":""}">${h(a.type)}</span>${lvBadge(a.level||"int")}${a.source?` <span class="chip warn">${h(a.source)}</span>`:""}</div>
   <div class="t"><button class="btn link" style="font-weight:700;color:var(--text);text-align:left" data-act="editActivity" data-id="${a.id}">${h(a.title)}</button></div>
   <div>${comps}${a.place?` <span class="small muted">📍${h(a.place)}</span>`:""}${a.amount?` <span class="small"><b>${fmt(a.amount)}만원</b></span>`:""}</div>
   ${a.content?`<div class="c">${h(a.content.length>220?a.content.slice(0,220)+"…":a.content)}</div>`:""}
   ${(a.followups||[]).map(f=>`<div class="fu"><label><input type="checkbox" data-act="toggleFu" data-a="${a.id}" data-f="${f.id}" ${f.done?"checked":""}> <span class="${f.done?"done":""}">${h(f.text)}</span></label>${f.due?` <span class="small muted">~${h(f.due)}</span>`:""}</div>`).join("")}
  </li>`;
}

function viewCompanies(){
  if(UI.company&&byId(DB.companies,UI.company))return viewCompany(byId(DB.companies,UI.company));
  const q=(UI.cq||"").trim().toLowerCase();
  const list=sortCompanies().filter(c=>!q||[c.name,c.field,c.products].join(" ").toLowerCase().includes(q));
  return `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">참여기업 (${DB.companies.length})</h2><span class="spacer"></span>
    <input type="search" placeholder="기업명·분야 검색" value="${h(UI.cq||"")}" data-inp="cq" style="width:200px"><button class="btn pri" data-act="newCompany">+ 기업 등록</button></div>
  <div class="card" style="padding:0"><div class="tbl-wrap"><table><thead><tr><th>기업명</th><th>분야</th><th>상태</th><th>박람회</th><th>최근 실적</th><th class="num">누적 계약</th><th class="num">누적 신규고용</th><th>최근 접촉</th></tr></thead><tbody>
  ${list.map(c=>{const s=companyStats(c.id);return `<tr class="click" data-act="openCompany" data-id="${c.id}">
    <td><b>${h(c.name)}</b>${c.consentPublic?` <span class="chip grn" title="실적 공개 동의">공개동의</span>`:""}</td><td>${h(c.field||"")}</td>
    <td><span class="chip ${c.status==="종료"?"":c.status==="휴면"?"warn":"blue"}">${h(c.status||"참여중")}</span></td>
    <td class="small">${s.expos.map(e=>h(e.name.split(" (")[0])).join(", ")}</td>
    <td>${s.lastPeriod?periodLabel(s.lastPeriod):`<span class="muted">없음</span>`}</td>
    <td class="num">${fmt(s.sum.contracts)}건<div class="small muted">${fmt(s.sum.contractAmount)}백만원</div></td>
    <td class="num">${fmt(s.sum.newHires)}명</td><td>${s.lastContact||`<span class="muted">-</span>`}</td></tr>`}).join("")}
  </tbody></table>${list.length?"":`<div class="empty">${DB.companies.length?"검색 결과가 없습니다":"‘+ 기업 등록’으로 참여기업을 추가하세요"}</div>`}</div></div>`;
}

function viewCompany(c){
  const s=companyStats(c.id), shown=reveal.has(c.id);
  const info=COMPANY_FIELDS.filter(f=>!["name","consentPublic"].includes(f.k)).map(f=>{
    let v=c[f.k];if(v===undefined||v==="")v=`<span class="muted">-</span>`;
    else if(f.lv==="sec"&&!shown)v=`<span class="mask">••••••</span>`;
    else v=f.type==="url"&&/^https?:\/\//.test(v)?`<a href="${h(v)}" target="_blank" rel="noopener">${h(v)}</a>`:h(v);
    return `<div class="${f.wide?"wide":""}" style="${f.wide?"grid-column:1/-1":""}"><div class="k">${h(f.label)}${lvBadge(f.lv)}</div><div class="v">${v}</div></div>`}).join("");
  return `<button class="btn sm back" data-act="closeCompany">← 기업 목록</button>
  <div class="card"><div class="row"><h2 style="margin:0">${h(c.name)}</h2>${c.consentPublic?`<span class="chip grn">실적 공개 동의</span>`:`<span class="chip">실적 비공개</span>`}<span class="spacer"></span>
    <button class="btn sm" data-act="toggleReveal" data-id="${c.id}">${shown?"대외비 가리기":"대외비 보기"}</button>
    <button class="btn sm" data-act="copyFormLink" data-id="${c.id}">제출양식 링크 복사</button>
    <button class="btn sm" data-act="editCompany" data-id="${c.id}">편집</button></div>
    <div class="info-grid" style="margin-top:14px">${info}</div>
    <div style="margin-top:14px"><span class="small muted">참가 박람회</span> ${s.expos.length?s.expos.map(e=>`<span class="chip org">${h(e.name)}</span>`).join(""):`<span class="muted small">없음</span>`}</div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">누적 계약</div><div class="v">${fmt(s.sum.contracts)}<small>건</small></div><div class="s">${fmt(s.sum.contractAmount)}백만원</div></div>
    <div class="kpi"><div class="l">누적 신규 고용</div><div class="v">${fmt(s.sum.newHires)}<small>명</small></div><div class="s">${s.employees!=null?`최근 총원 ${fmt(s.employees)}명`:""}${c.employeesBase?` / 참여 당시 ${fmt(c.employeesBase)}명`:""}</div></div>
    <div class="kpi"><div class="l">MOU·협약</div><div class="v">${fmt(s.sum.mous)}<small>건</small></div><div class="s">해외 계약 ${fmt(s.sum.overseasContracts)}건</div></div>
    <div class="kpi"><div class="l">활동기록</div><div class="v">${s.acts.length}<small>건</small></div><div class="s">최근 ${s.lastContact||"-"}</div></div>
  </div>
  <div class="card"><div class="row"><h3 style="margin:0">분기 실적</h3><span class="spacer"></span><button class="btn sm" data-act="newReport" data-c="${c.id}">+ 실적 입력</button></div>
    ${s.reps.length?reportTable(s.reps,false):`<div class="empty">실적이 없습니다. 기업에 제출양식 링크를 보내 보세요.</div>`}</div>
  <div class="card"><div class="row"><h3 style="margin:0">활동기록 (면담·행사·기부·네트워킹)</h3><span class="spacer"></span><button class="btn sm" data-act="newActivity" data-c="${c.id}">+ 기록</button></div>
    ${s.acts.length?`<ul class="timeline" style="margin-top:12px">${s.acts.map(actItem).join("")}</ul>`:`<div class="empty">기록이 없습니다</div>`}</div>`;
}

function reportTable(reps,showCompany=true){
  return `<div class="tbl-wrap"><table><thead><tr>${showCompany?"<th>기업</th>":""}<th>분기</th><th class="num">계약</th><th class="num">금액(백만원)</th><th class="num">해외</th><th class="num">MOU</th><th class="num">신규고용</th><th class="num">총원</th><th class="num">투자${lvBadge("sec")}</th><th>출처</th></tr></thead><tbody>
  ${reps.map(r=>`<tr class="click" data-act="editReport" data-id="${r.id}">${showCompany?`<td><b>${h(cname(r.companyId))}</b></td>`:""}<td>${periodLabel(r.period)}</td>
  <td class="num">${fmt(r.contracts)}</td><td class="num">${fmt(r.contractAmount)}</td><td class="num">${fmt(r.overseasContracts)}</td><td class="num">${fmt(r.mous)}</td>
  <td class="num">${fmt(r.newHires)}</td><td class="num">${r.totalEmployees!==""&&r.totalEmployees!=null?fmt(r.totalEmployees):"-"}</td><td class="num">${fmt(r.investment)}</td>
  <td><span class="chip ${r.source==="기업 제출"?"warn":""}">${h(r.source||"")}</span></td></tr>`).join("")}</tbody></table></div>`;
}

function viewReports(){
  const fp=UI.rp||"",fc=UI.rc||"";
  const list=DB.reports.filter(r=>(!fp||r.period===fp)&&(!fc||r.companyId===fc)).sort((a,b)=>b.period.localeCompare(a.period)||cname(a.companyId).localeCompare(cname(b.companyId),"ko"));
  const s=sumReports(list);
  return `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">분기 실적</h2><span class="spacer"></span>

let formCtx=null;
function closeModal(){document.getElementById("modalRoot").innerHTML="";formCtx=null}
function fieldHTML(f,val){
  const id="f_"+f.k, req=f.req?" required":"";
  const lab=`<label for="${id}">${h(f.label)}${f.req?' <span style="color:var(--accent)">*</span>':""}${lvBadge(f.lv)}</label>`;
  const hint=f.hint?`<span class="hint">${h(f.hint)}</span>`:"";
  const wide=f.wide||["textarea","companies","followups"].includes(f.type)?" wide":"";
  let inp;
  switch(f.type){
    case "textarea":inp=`<textarea id="${id}" name="${f.k}"${req}>${h(val??"")}</textarea>`;break;
    case "select":inp=`<select id="${id}" name="${f.k}"${req}>${f.options.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${h(v)}" ${String(val??"")===v?"selected":""}>${h(l)}</option>`}).join("")}</select>`;break;
    case "check":inp=`<label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="${id}" name="${f.k}" ${val?"checked":""}> 예</label>`;break;
    case "period":inp=`<select id="${id}" name="${f.k}"${req}>${periods().map(p=>`<option value="${p}" ${p===val?"selected":""}>${periodLabel(p)}</option>`).join("")}</select>`;break;
    case "company":inp=`<select id="${id}" name="${f.k}"${req}><option value="">선택</option>${sortCompanies().map(c=>`<option value="${c.id}" ${c.id===val?"selected":""}>${h(c.name)}</option>`).join("")}</select>`;break;
    case "companies":{const set=new Set(val||[]);inp=`<div class="checks" data-multi="${f.k}">${sortCompanies().map(c=>`<label><input type="checkbox" value="${c.id}" ${set.has(c.id)?"checked":""}> ${h(c.name)}</label>`).join("")||`<span class="small muted">먼저 기업을 등록하세요</span>`}</div>`;break}
    case "followups":inp=`<div id="fuBox">${(val||[]).map(fuRow).join("")}</div><button type="button" class="btn sm" data-act="addFu">+ 후속조치 추가</button>`;break;
    default:inp=`<input type="${f.type||"text"}" id="${id}" name="${f.k}" value="${h(val??"")}"${f.type==="number"?' step="any" inputmode="decimal"':""}${req}>`;
  }
  return `<div class="f${wide}">${lab}${inp}${hint}</div>`;
}
function fuRow(f={}){return `<div class="fu-row" data-fu="${h(f.id||uid())}"><input type="checkbox" title="완료" ${f.done?"checked":""}><input type="text" placeholder="할 일 (예: 실증 부지 자료 회신)" value="${h(f.text||"")}"><input type="date" value="${h(f.due||"")}" title="기한"><button type="button" class="btn sm danger" data-act="rmFu">삭제</button></div>`}
function openForm(title,defs,value,onSave,onDelete,extra=""){
  formCtx={defs,onSave,onDelete};
  document.getElementById("modalRoot").innerHTML=`<div class="ov" data-act="ovClose"><div class="modal" role="dialog" aria-modal="true"><h3>${h(title)}</h3>${extra}
  <form id="mf" novalidate><div class="fgrid">${defs.map(f=>fieldHTML(f,value[f.k])).join("")}</div><div class="err" id="mfErr"></div>
  <div class="actions">${onDelete?`<button type="button" class="btn danger" data-act="formDelete" style="margin-right:auto">삭제</button>`:""}<button type="button" class="btn" data-act="closeModal">취소</button><button class="btn pri">저장</button></div></form></div></div>`;
  const form=document.getElementById("mf");
  form.onsubmit=e=>{e.preventDefault();const out={};
    for(const f of defs){
      if(f.type==="companies"){out[f.k]=[...form.querySelectorAll(`[data-multi="${f.k}"] input:checked`)].map(x=>x.value);continue}
      if(f.type==="followups"){out[f.k]=[...form.querySelectorAll("[data-fu]")].map(r=>{const i=r.querySelectorAll("input");return {id:r.dataset.fu,done:i[0].checked,text:i[1].value.trim(),due:i[2].value}}).filter(x=>x.text);continue}
      const el=form.elements[f.k];if(!el)continue;
      if(f.type==="check")out[f.k]=el.checked;
      else if(f.type==="number")out[f.k]=el.value===""?"":Number(el.value);
      else out[f.k]=el.value.trim();
      if(f.req&&(out[f.k]===""||out[f.k]==null)){document.getElementById("mfErr").textContent=`‘${f.label}’을(를) 입력하세요.`;el.focus();return}
    }
    if(onSave(out)!==false){closeModal();commit()}};
  setTimeout(()=>form.querySelector("input,select,textarea")?.focus(),30);
}

function defaultFormUrl(){return location.href.split(/[?#]/)[0].replace(/[^/]*$/,"submit.html")}
function formLink(c,p){const base=DB.settings.formUrl||defaultFormUrl();const q=new URLSearchParams();if(c){q.set("code",c.id);q.set("name",c.name)}if(p)q.set("period",p);if(DB.settings.sendTo)q.set("to",DB.settings.sendTo);return base+(base.includes("?")?"&":"?")+q.toString()}
async function copy(text,msg){try{await navigator.clipboard.writeText(text);toast(msg||"복사했습니다")}catch(e){prompt("아래 내용을 복사하세요",text)}}

/* ===================== 가져오기·내보내기 ===================== */
function pickFiles(multiple){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.multiple=!!multiple;i.onchange=()=>res([...i.files]);i.click()})}
async function doBackup(){
  DB.settings.lastBackup=new Date().toISOString();
  const payload=KEY?{format:"cxp-backup",v:1,encrypted:true,enc:await encryptObj(DB,KEY,SALT)}:{format:"cxp-backup",v:1,encrypted:false,data:DB};
  download(`참여기업관리_백업_${today()}.json`,JSON.stringify(payload));markDirty();render();toast("백업 파일을 저장했습니다. 내부 공유폴더로 옮겨 두세요.");
}
async function readBackup(){
  const [f]=await pickFiles(false);if(!f)return null;
  let j;try{j=JSON.parse(await f.text())}catch(e){alert("백업 파일을 읽을 수 없습니다.");return null}
  if(j.format!=="cxp-backup"){alert("관리대장 백업 파일이 아닙니다.");return null}
  if(!j.encrypted)return {db:migrate(j.data)};
  const pw=prompt("백업 파일을 만들 때의 암호를 입력하세요");if(pw==null)return null;
  try{const r=await decryptObj(j.enc,pw);return {db:migrate(r.obj),key:r.key,salt:unb64(j.enc.salt)}}catch(e){alert("암호가 맞지 않습니다.");return null}
}
async function doRestore(fromSetup){
  const r=await readBackup();if(!r)return;
  if(!fromSetup&&!confirm(`백업(기업 ${r.db.companies.length}곳, 실적 ${r.db.reports.length}건, 활동 ${r.db.activities.length}건)으로 현재 데이터를 바꿉니다. 계속할까요?`))return;
  DB=r.db;if(r.key){KEY=r.key;SALT=r.salt}
  await persist();start();toast("백업을 복원했습니다");
}
async function importSubmissions(){
  const files=await pickFiles(true);if(!files.length)return;
  const items=[];
  for(const f of files){try{const j=JSON.parse(await f.text());if(j.format!=="cxp-submission"){items.push({file:f.name,err:"제출양식 파일이 아님"});continue}
    let c=j.companyCode&&byId(DB.companies,j.companyCode);if(!c)c=DB.companies.find(x=>normName(x.name)===normName(j.companyName));
    const ex=c&&DB.reports.find(r=>r.companyId===c.id&&r.period===j.period);
    items.push({file:f.name,j,c,ex,ok:true})}catch(e){items.push({file:f.name,err:"읽을 수 없음"})}}
  formCtx={import:items};
  document.getElementById("modalRoot").innerHTML=`<div class="ov"><div class="modal"><h3>기업 제출파일 가져오기</h3>
  <div class="tbl-wrap"><table><thead><tr><th>파일</th><th>기업</th><th>분기</th><th>처리</th></tr></thead><tbody>
  ${items.map((it,i)=>it.err?`<tr><td class="small">${h(it.file)}</td><td colspan="3" style="color:var(--accent)">${h(it.err)}</td></tr>`:
    `<tr><td class="small">${h(it.file)}</td><td><b>${h(it.j.companyName)}</b>${it.c?"":`<div class="small" style="color:var(--accent)">등록되지 않은 기업 → 새로 등록</div>`}</td><td>${periodLabel(it.j.period)}</td>
    <td><label class="small"><input type="checkbox" data-imp="${i}" checked> ${it.ex?"기존 실적 덮어쓰기":"새로 추가"}</label>${(it.j.news||[]).length?`<div class="small muted">소식 ${it.j.news.length}건 → 활동기록</div>`:""}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="small muted">기업이 보낸 담당자 연락처·공개 동의 여부도 기업 정보에 반영됩니다.</p>
  <div class="actions"><button class="btn" data-act="closeModal">취소</button><button class="btn pri" data-act="confirmImport">가져오기</button></div></div></div>`;
}
function confirmImport(){
  const items=formCtx.import;let n=0;
  document.querySelectorAll("[data-imp]").forEach(cb=>{if(!cb.checked)return;const it=items[+cb.dataset.imp];const j=it.j;
    let c=it.c;if(!c){c={id:uid(),name:j.companyName,status:"참여중",createdAt:new Date().toISOString()};DB.companies.push(c)}
    if(j.contact){if(j.contact.name)c.contactName=j.contact.name;if(j.contact.phone)c.contactPhone=j.contact.phone;if(j.contact.email)c.contactEmail=j.contact.email}
    if(typeof j.consentPublic==="boolean")c.consentPublic=j.consentPublic;
    DB.reports=DB.reports.filter(r=>!(r.companyId===c.id&&r.period===j.period));
    const rep={};REPORT_FIELDS.forEach(f=>{if(j.report&&j.report[f.k]!==undefined&&!["companyId","period","source","memo"].includes(f.k))rep[f.k]=j.report[f.k]});
    DB.reports.push({id:uid(),...rep,companyId:c.id,period:j.period,source:"기업 제출",submittedAt:j.submittedAt,createdAt:new Date().toISOString()});
    (j.news||[]).forEach(nw=>{if(!nw.title)return;const key=c.id+"|"+nw.date+"|"+nw.title;if(DB.activities.some(a=>a.importKey===key))return;
      DB.activities.push({id:uid(),importKey:key,type:ACT_TYPES.includes(nw.type)?nw.type:"기타",date:nw.date||today(),title:nw.title,content:nw.content||"",amount:nw.amount||"",companyIds:[c.id],level:"int",source:"기업 제출",followups:[],createdAt:new Date().toISOString()})});
    n++});
  closeModal();commit();toast(`${n}건을 가져왔습니다`);
}
function csvCell(v){v=Array.isArray(v)?v.join("; "):String(v??"");return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(k){
  const inc=document.getElementById("incSec")?.checked;
  if(inc&&!confirm("대외비 항목을 포함합니다. 파일을 외부로 보내지 마세요."))return;
  let cols,rows;
  if(k==="companies"){cols=COMPANY_FIELDS.filter(f=>inc||f.lv!=="sec");rows=sortCompanies().map(c=>cols.map(f=>f.type==="check"?(c[f.k]?"Y":"N"):c[f.k]))}
  else if(k==="reports"){cols=[{label:"기업"},...REPORT_FIELDS.filter(f=>f.k!=="companyId"&&(inc||f.lv!=="sec"))];rows=[...DB.reports].sort((a,b)=>a.period.localeCompare(b.period)).map(r=>[cname(r.companyId),...cols.slice(1).map(f=>f.k==="period"?periodLabel(r.period):r[f.k])])}
  else{const list=DB.activities.filter(a=>inc||a.level!=="sec").sort((a,b)=>a.date.localeCompare(b.date));
    cols=[{label:"날짜"},{label:"구분"},{label:"제목"},{label:"관련 기업"},{label:"장소"},{label:"참석자"},{label:"금액(만원)"},{label:"내용"},{label:"후속조치"},{label:"공개범위"}];
    rows=list.map(a=>[a.date,a.type,a.title,(a.companyIds||[]).map(cname),a.place,a.attendees,a.amount,a.content,(a.followups||[]).map(f=>(f.done?"[완료] ":"[ ] ")+f.text+(f.due?" ~"+f.due:"")),LV[a.level||"int"]])}
  const text="﻿"+[cols.map(c=>c.label),...rows].map(r=>r.map(csvCell).join(",")).join("\r\n");
  download(`참여기업_${{companies:"기업",reports:"실적",activities:"활동기록"}[k]}_${today()}${inc?"_대외비포함":""}.csv`,text,"text/csv;charset=utf-8");
}
function publicSummary(){
  const all=sumReports(DB.reports);const pub=sortCompanies().filter(c=>c.consentPublic);
  const pubActs=DB.activities.filter(a=>a.level==="pub").sort((a,b)=>b.date.localeCompare(a.date));
  const donations=DB.activities.filter(a=>a.type==="기부·사회공헌");
  const html=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>참여기업 성과 요약</title><style>body{font-family:"Malgun Gothic",sans-serif;max-width:860px;margin:30px auto;padding:0 20px;color:#1d1d1f;line-height:1.6}h1{color:#1c4690;font-size:22px}table{border-collapse:collapse;width:100%;margin:10px 0 24px}th,td{border:1px solid #ccc;padding:6px 8px;font-size:14px}th{background:#eef1f6}td.n{text-align:right}.m{color:#666;font-size:13px}</style></head><body>
  <h1>해외 AI·스마트시티 박람회 참여기업 성과 요약</h1><p class="m">${h(DB.settings.dept||"천안시")} · ${today()} 기준 · 기업 보고 자료 집계</p>
  <h2>전체 성과 (참여기업 ${DB.companies.filter(c=>c.status!=="종료").length}곳)</h2>
  <table><tr><th>계약</th><th>계약 금액</th><th>해외 계약</th><th>MOU·협약</th><th>신규 고용</th></tr><tr><td class="n">${fmt(all.contracts)}건</td><td class="n">${fmt(all.contractAmount)}백만원</td><td class="n">${fmt(all.overseasContracts)}건</td><td class="n">${fmt(all.mous)}건</td><td class="n">${fmt(all.newHires)}명</td></tr></table>
  <h2>박람회 참가</h2><table><tr><th>박람회</th><th>기간</th><th>개최지</th><th>참가 기업 수</th><th>현장 상담</th><th>MOU</th></tr>${[...DB.expos].sort((a,b)=>(a.start||"").localeCompare(b.start||"")).map(e=>`<tr><td>${h(e.name)}</td><td>${h(e.start||"")}${e.end?"~"+h(e.end):""}</td><td>${h(e.city||"")}</td><td class="n">${(e.companyIds||[]).length}곳</td><td class="n">${fmt(e.meetings)}건</td><td class="n">${fmt(e.mous)}건</td></tr>`).join("")}</table>
  ${pub.length?`<h2>기업별 성과 (공개 동의 기업)</h2><table><tr><th>기업</th><th>분야</th><th>주요 제품·서비스</th><th>계약</th><th>신규 고용</th></tr>${pub.map(c=>{const s=sumReports(DB.reports.filter(r=>r.companyId===c.id));return `<tr><td>${h(c.name)}</td><td>${h(c.field||"")}</td><td>${h(c.products||"")}</td><td class="n">${fmt(s.contracts)}건</td><td class="n">${fmt(s.newHires)}명</td></tr>`}).join("")}</table>`:""}
  ${donations.length?`<h2>지역사회 공헌</h2><p>참여기업 기부·사회공헌 ${donations.length}건${donations.some(d=>d.amount)?`, 총 ${fmt(donations.reduce((s,d)=>s+num(d.amount),0))}만원`:""}</p>`:""}
  ${pubActs.length?`<h2>주요 활동 (공개 기록)</h2><ul>${pubActs.slice(0,15).map(a=>`<li>${h(a.date)} [${h(a.type)}] ${h(a.title)}</li>`).join("")}</ul>`:""}
  <p class="m">※ 개별 기업의 금액·연락처 등 대외비 정보는 포함하지 않았습니다. 공개 동의하지 않은 기업은 합계에만 반영됩니다.</p></body></html>`;
  const w=window.open(URL.createObjectURL(new Blob([html],{type:"text/html"})),"_blank");
  if(!w)download(`참여기업_공개요약_${today()}.html`,html,"text/html");
}
async function changePw(){
  const a=prompt(KEY?"새 암호 (8자 이상). 비우면 암호를 해제합니다":"새 암호 (8자 이상)");if(a==null)return;
  if(a===""){if(KEY&&confirm("암호를 해제하면 데이터가 암호화되지 않은 채 저장됩니다. 계속할까요?")){KEY=null;SALT=null;await persist();start()}return}
  if(a.length<8){alert("8자 이상으로 정해 주세요.");return}
  if(prompt("한 번 더 입력하세요")!==a){alert("두 암호가 다릅니다.");return}
  SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(a,SALT);await persist();start();toast("암호를 설정했습니다. 이전 백업 파일은 이전 암호로 열립니다.");
}

/* ===================== 이벤트 ===================== */
const ACTIONS={
  tab:d=>{UI.tab=d.k;if(d.k!=="companies")UI.company=null;saveUI();render();scrollTo(0,0)},
  lock:()=>lockNow(),
  noPassword:()=>{if(confirm("암호 없이 시작하면 이 PC를 쓰는 누구나 기업 정보를 볼 수 있습니다. 나중에 자료관리에서 암호를 설정할 수 있습니다.")){DB=DB||emptyDB();persist();start()}},
  restoreFromSetup:()=>doRestore(true),
  resetAll:()=>{if(!confirm("이 PC 브라우저의 관리대장 데이터를 모두 지웁니다. 되돌릴 수 없습니다."))return;if(prompt("확인을 위해 ‘삭제’라고 입력하세요")!=="삭제")return;
    try{localStorage.removeItem(STORE_ENC);localStorage.removeItem(STORE_PLAIN)}catch(e){}DB=null;KEY=null;SALT=null;closeModal();document.getElementById("app").innerHTML="";boot()},
  newCompany:()=>editCompany(null),
  openCompany:d=>{UI.company=d.id;saveUI();render();scrollTo(0,0)},
  closeCompany:()=>{UI.company=null;saveUI();render()},
  editCompany:d=>editCompany(byId(DB.companies,d.id)),
  toggleReveal:d=>{reveal.has(d.id)?reveal.delete(d.id):reveal.add(d.id);render()},
  copyFormLink:d=>{const c=d.id&&byId(DB.companies,d.id);copy(formLink(c,prevQuarter(quarterOf())),c?`${c.name} 전용 제출 링크를 복사했습니다`:"공통 제출 링크를 복사했습니다")},
  copyRequest:d=>{const c=byId(DB.companies,d.id);copy(`[${DB.settings.dept||"천안시"}] ${c.name} 담당자님, ${periodLabel(d.p)} 실적(계약·고용 등) 제출을 부탁드립니다.\n아래 양식에 입력하신 뒤 만들어지는 파일을 회신해 주세요(약 5분 소요, 입력 내용은 인터넷으로 전송되지 않습니다).\n${formLink(c,d.p)}`,"요청 문구를 복사했습니다. 메일·메신저에 붙여 넣으세요")},
  newReport:d=>editReport(null,d.c),
  editReport:d=>editReport(byId(DB.reports,d.id)),
  newActivity:d=>editActivity(null,d.c),
  editActivity:d=>editActivity(byId(DB.activities,d.id)),
  newExpo:()=>editExpo(null),
  editExpo:d=>editExpo(byId(DB.expos,d.id)),
  toggleFu:(d,e)=>{const a=byId(DB.activities,d.a);const f=a&&(a.followups||[]).find(x=>x.id===d.f);if(f){f.done=e.target.checked;f.doneAt=f.done?today():"";commit()}},
  toggleAo:(d,e)=>{UI.ao=e.target.checked;saveUI();render()},
  addFu:()=>document.getElementById("fuBox").insertAdjacentHTML("beforeend",fuRow()),
  rmFu:(d,e)=>e.target.closest(".fu-row").remove(),
  closeModal:()=>closeModal(),
  ovClose:(d,e)=>{if(e.target.classList.contains("ov")&&confirm("입력 중인 내용을 닫을까요?"))closeModal()},
  formDelete:()=>formCtx?.onDelete?.(),
  backup:()=>doBackup(),
  restore:()=>doRestore(false),
  importSubmissions:()=>importSubmissions(),
  confirmImport:()=>confirmImport(),
  csv:d=>exportCSV(d.k),
  publicSummary:()=>publicSummary(),
  changePw:()=>changePw()
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const fn=ACTIONS[b.dataset.act];if(!fn)return;
  if(b.dataset.act==="ovClose"&&b!==e.target)return;
  if(b.tagName==="TR"&&e.target.closest("button,a,input"))return;
  if(!(b.type==="checkbox"))e.preventDefault();fn(b.dataset,e)});
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.chg){UI[el.dataset.chg]=el.value;saveUI();render()}
  if(el.dataset.setting){DB.settings[el.dataset.setting]=el.value.trim();markDirty()}});
let inpT=null;
document.addEventListener("input",e=>{const el=e.target;if(!el.dataset.inp)return;UI[el.dataset.inp]=el.value;clearTimeout(inpT);
  inpT=setTimeout(()=>{const pos=el.selectionStart;render();const n=document.querySelector(`[data-inp="${el.dataset.inp}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.querySelector(".ov")&&confirm("입력 중인 내용을 닫을까요?"))closeModal()});
window.addEventListener("beforeunload",()=>{if(saveTimer&&DB){/* 마지막 저장 시도 */clearTimeout(saveTimer);persist()}});
boot();
</script>
